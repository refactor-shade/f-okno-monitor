name: Monitor SIZO-11 slots

on:
  workflow_dispatch: {}
  schedule:
    # каждые 7 минут
    - cron: "*/7 * * * *"

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ставим стабильный Chrome
      - name: Install Chrome (stable)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Удаляем системный chromedriver, чтобы не мешал Selenium Manager
      - name: Remove preinstalled chromedriver
        run: sudo rm -f /usr/bin/chromedriver || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor (single check)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ДОБАВЬ ЭТО:
          F_OKNO_EMAIL: ${{ secrets.F_OKNO_EMAIL }}
          F_OKNO_PASSWORD: ${{ secrets.F_OKNO_PASSWORD }}

          TARGET_URL: "https://f-okno.ru/base/irkutsk/sizo3tayshet"
          LOGIN_URL: "https://f-okno.ru/login?request_uri=%2Fbase%2Firkutsk%2Fsizo3tayshet"
          ONLY_NOTIFY_WHEN_FREE: "1"
          SE_MANAGER_USE_PATH: "0"
          TZ: Europe/Moscow
        run: python f_okno_monitor_selenium.py

        - name: Upload debug artifacts
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: debug
            path: |
              debug/*
              page.html
              page.png
