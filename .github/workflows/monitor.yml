name: Monitor SIZO-11 slots

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # раз в 10 минут (потом вернёшь чаще)

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug secrets presence (safe)
        run: |
          python - <<'PY'
          import os
          for k in ["F_OKNO_EMAIL","F_OKNO_PASSWORD","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID"]:
              v = os.getenv(k, "")
              print(f"{k}: {'SET' if v else 'MISSING'} (len={len(v)})")
          PY
        env:
          F_OKNO_EMAIL: ${{ secrets.F_OKNO_EMAIL }}
          F_OKNO_PASSWORD: ${{ secrets.F_OKNO_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run monitor (single check)
        run: python f_okno_monitor_selenium.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          F_OKNO_EMAIL: ${{ secrets.F_OKNO_EMAIL }}
          F_OKNO_PASSWORD: ${{ secrets.F_OKNO_PASSWORD }}
          TARGET_URL: "https://f-okno.ru/base/irkutsk/sizo3tayshet"
          LOGIN_URL: "https://f-okno.ru/login?request_uri=%2Fbase%2Firkutsk%2Fsizo3tayshet"
          ONLY_NOTIFY_WHEN_FREE: "1"
          SE_MANAGER_USE_PATH: "0"
          TZ: Europe/Moscow

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug/*
            page.html
            page.png
