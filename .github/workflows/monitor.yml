name: Monitor SIZO slots

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # раз в 10 минут

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    # Пробуем брать из secrets. Если у тебя TELEGRAM_CHAT_ID лежит в Variables (vars),
    # код ниже всё равно его подхватит через *_VAR (см. env).
    env:
      # Telegram (secrets preferred)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Telegram fallback (if you stored them as Actions Variables)
      TELEGRAM_BOT_TOKEN_VAR: ${{ vars.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID_VAR: ${{ vars.TELEGRAM_CHAT_ID }}

      # f-okno creds
      F_OKNO_EMAIL: ${{ secrets.F_OKNO_EMAIL }}
      F_OKNO_PASSWORD: ${{ secrets.F_OKNO_PASSWORD }}

      # target/login
      TARGET_URL: "https://f-okno.ru/base/moscovskaya_oblast/sizo11noginsk"
      LOGIN_URL: "https://f-okno.ru/login?request_uri=%2Fbase%2Fmoscovskaya_oblast%2Fsizo11noginsk"

      # behaviour
      ONLY_NOTIFY_WHEN_FREE: "1"
      SE_MANAGER_USE_PATH: "0"
      TZ: Europe/Moscow

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug env presence (safe)
        run: |
          python - <<'PY'
          import os
          keys = [
            "F_OKNO_EMAIL","F_OKNO_PASSWORD",
            "TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID",
            "TELEGRAM_BOT_TOKEN_VAR","TELEGRAM_CHAT_ID_VAR",
            "TARGET_URL","LOGIN_URL"
          ]
          for k in keys:
              v = os.getenv(k, "")
              print(f"{k}: {'SET' if v else 'MISSING'} (len={len(v)})")
          PY

      - name: Run monitor (single check)
        run: python f_okno_monitor_selenium.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug/*
            page.html
            page.png
